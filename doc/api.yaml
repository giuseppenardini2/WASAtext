openapi: 3.0.0
servers:
  - url: "http://localhost:3000"
info:
  title: WASAtext
  description: |-
    Connect with your friends effortlessly using WASAText! Send and receive messages, whether one-on-one
    or in groups, all from the convenience of your PC. Enjoy seamless conversations with text or GIFs and
    easily stay in touch through your private chats or group discussions.
  version: 0.0.1

tags:
  - name: "login"
    description: Login operations
  - name: "users"
    description: User management operations
  - name: "messages"
    description: Message operations
  - name: "conversations"
    description: Conversation operations
  - name: "groups"
    description: Group operations

#------------
# PATHS
#------------
paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              description: Username
              type: object
              properties:
                name: { $ref: "#/components/schemas/Username" }
        required: true
      responses:
        "200":
          description: User logged-in successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identifier" }
        "201":
          description: User created and logged-in successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identifier" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users:
    get:
      operationId: getUsers
      tags: ["users"]
      summary: Get the list of the users
      description: |-
        Return a list of users
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/username"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCollection" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userID}:
    parameters:
      - $ref: "#/components/parameters/userID"

    get:
      operationId: getMyConversations
      tags: ["users"]
      summary: Get the list of the user conversation
      description: |- 
        Return a list of user conversation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPreviewCollection" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userID}/username:
    parameters:
      - $ref: "#/components/parameters/userID"

    put:
      operationId: setMyUserName
      tags: ["users"]
      summary: Set username
      description: |-
        Set the user username
      security:
        - bearerAuth: []
      requestBody:
        description: New username
        content:
          application/json:
            schema:
              description: Username
              type: object
              properties:
                username: { $ref: "#/components/schemas/Username" }
        required: true
      responses:
        "200":
          description: Username updated successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Username" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userID}/photos:
    parameters:
        - $ref: "#/components/parameters/userID"

    put:
      operationId: setMyPhoto
      tags: ["users"]
      summary: Set the user picture
      description: |-
        Set the user profile picture
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              description: User picture
              type: object
              properties:
                picture: { $ref: "#/components/schemas/Picture" }
        required: true
      responses:
        "200":
          description: Photo successfully uploaded
          content:
            text/plain:
              schema:
                description: Confirmation message
                type: string
                example: "Photo successfully uploaded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userID}/conversations:
    parameters:
        - $ref: "#/components/parameters/userID"

    get:
      operationId: getConversation
      tags: ["conversations"]
      summary: Get a single conversation
      description: |-
        Get a single conversation of the user using the recipient id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/recipientID"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageCollection" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userID}/conversations/{conversationID}/messages:
    parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/conversationID"

    post:
      operationId: sendMessage
      tags: ["messages"]
      summary: Send a message to a user
      description: |-
        Send a message to a user
      security:
        - bearerAuth: []
      parameters:
        - name: replyMessage
          description: ID of the message to which reply
          in: query
          required: false
          schema: { $ref: "#/components/schemas/Identifier" }
      requestBody:
        content:
          application/json:
            schema:
              description: Message parts
              type: object
              properties:
                body: { $ref: "#/components/schemas/Text" }
                picture: { $ref: "#/components/schemas/Picture" }
        required: true
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userID}/conversations/{conversationID}/messages/{messageID}:
    parameters:
      - $ref: "#/components/parameters/userID"
      - $ref: "#/components/parameters/messageID"
      - $ref: "#/components/parameters/conversationID"

    post:
      operationId: forwardMessage
      tags: ["messages"]
      summary: Forward a message to a user
      description: |-
        Forward a message to a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/recipientID"
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: deleteMessage
      tags: ["messages"]
      summary: Delete a message
      description: |-
        Delete a message
      security:
        - bearerAuth: []
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userID}/conversations/{conversationID}/messages/{messageID}/reactions:
    parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/conversationID"
        - $ref: "#/components/parameters/messageID"
    
    post:
      operationId: commentMessage
      tags: ["messages"]
      summary: Comment a message
      description: |-
        Comment a message
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              description: Reaction parts
              type: object
              properties:
                emoji: { $ref: "#/components/schemas/Emoji" }
        required: true
      responses:
        "201":
          description: Reaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reaction" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userID}/conversations/{conversationID}/messages/{messageID}/reactions/{reactionID}:
    parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/conversationID"
        - $ref: "#/components/parameters/messageID"
        - $ref: "#/components/parameters/reactionID"
    
    delete:
      operationId: uncommentMessage
      tags: ["messages"]
      summary: Uncomment a message
      description: |-
        Uncomment a message
      security:
        - bearerAuth: []
      responses:
        "204": 
          $ref: "#/components/responses/NoContent"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userID}/groups:
    parameters:
        - $ref: "#/components/parameters/userID"

    post:
      operationId: createGroup
      tags: ["groups"]
      summary: Create a group
      description: |-
        Create a group
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Group" }
        required: true
      responses:
        "201":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }

  /users/{userID}/groups/{groupID}:
    parameters:
      - $ref: "#/components/parameters/userID"
      - $ref: "#/components/parameters/groupID"

    put:
      operationId: setGroupName
      tags: ["groups"]
      summary: Set the name of a group
      description: |-
        Set the group name
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              description: Group name
              type: object
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
        required: true
      responses:
        "200":
          description: Group name updated successful
          content: 
            application/json:
              schema: { $ref: "#/components/schemas/GroupName" }
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: leaveGroup
      tags: ["groups"]
      summary: Leave a group
      description: |-
        Leave the user from the current group
      security:
        - bearerAuth: []
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userID}/groups/{groupID}/participants:
    parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/groupID"
    
    put:
      operationId: addToGroup
      tags: ["groups"]
      summary: Add the a user to the current group
      description: |-
        Add the current user to a group
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/User" }
        required: true
      responses:
        "200":
          description: ID of the user added to the group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identifier"}
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userID}/groups/{groupID}/photos:
    parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/groupID"

    put:
      operationId: setGroupPhoto
      tags: ["groups"]
      summary: Set the photo of a group
      description: |-
        Set the group profile picture
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              description: User picture
              type: object
              properties:
                picture: { $ref: "#/components/schemas/Picture" }
        required: true
      responses:
        "200":
          description: Photo successfully uploaded
          content:
            text/plain:
              schema:
                description: Confirmation message
                type: string
                example: "Photo successfully uploaded"
        "404":
          $ref: "#/components/responses/NotFound"


#------------
# COMPONENTS
#------------
components:
  #-- SCHEMAS
  schemas:
    Identifier:
      title: Identifier
      description: This object represents a single identifier
      type: integer
      minimum: 0
      example: 123

    Username:
      title: Username
      description: This object represents a single username
      type: string
      pattern: '^.*?$'
      minLength: 3
      maxLength: 16
      example: "SignorG"

    Text:
      title: Text
      description: This object represent a message text
      type: string
      pattern: "[^\\\\]"
      minLength: 0
      maxLength: 200
      example: "Hello Enzo"

    Picture:
      title: Picture
      description: User or group picture
      type: string
      format: binary
      minLength: 0
      maxLength: 9999

    Date:
      title: Date
      description: The date of the last sent message
      type: string
      format: date-time
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}$"
      example: "2017-07-21T17:32:28"
      minLength: 19
      maxLength: 19

    User:
      title: User
      description: This object represents a single user
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        username: { $ref: "#/components/schemas/Username" }
        profilePicture: { $ref: "#/components/schemas/Picture" }
      required:
        - id
        - username
        - profilePicture
    
    UserCollection:
      title: Users
      description: This object represents a list of user object
      type: object
      properties:
        users:
          description: Users
          type: array
          items: { $ref: "#/components/schemas/User" }
          uniqueItems: true
          minItems: 0
          maxItems: 50
      required:
        - users

    ConversationPreview:
      title: Conversation preview
      description: This object represents a single conversation
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        picture: { $ref: "#/components/schemas/Picture" }
        messagePreview:
          description: Last message preview
          type: string
          pattern: "[^\n\t]"
          minLength: 1
          maxLength: 20
          example: "Ciao Enzo, ..."
        date: { $ref: "#/components/schemas/Date" }
      required:
        - id
        - picture
        - messagePreview
        - date

    ConversationPreviewCollection:
      title: Conversation previews
      description: This object represents a list of conversation previews object
      type: object
      properties:
        conversationPrewiews:
          description: Conversations of the current user
          type: array
          items: { $ref: "#/components/schemas/ConversationPreview" }
          uniqueItems: true
          minItems: 0
          maxItems: 50
      required:
        - conversationPrewiews
          
    Message:
      title: Message
      description: This object represents a single message
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        body: { $ref: "#/components/schemas/Text" }
        picture: { $ref: "#/components/schemas/Picture" }
        date: { $ref: "#/components/schemas/Date" }
      required:
        - id
        - body
        - date

    MessageCollection:
      title: Messages
      description: This object represents a list of message object
      type: object
      properties:
        messages:
          description: List of messages
          type: array
          items: { $ref: "#/components/schemas/Message" }
          uniqueItems: true
          minItems: 0
          maxItems: 50
      required:
        - messages

    Emoji:
      title: Emoji
      description: A emojii
      type: string
      pattern: "^.*?$"
      minLength: 1
      maxLength: 1
      example: "😂"

    Reaction:
      title: Message reaction
      description: This object represents a single reaction to a message
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        emoji: { $ref: "#/components/schemas/Emoji" }
      required:
        - id
        - emoji

    GroupName:
      title: Group name
      description: Group name
      type: string
      pattern: ^[a-zA-Z0-9\s!?-]{3,20}$
      example: "I due corsari"
      minLength: 3
      maxLength: 20

    Group:
      title: Group
      description: This object represents a single group
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        name: { $ref: "#/components/schemas/GroupName" }
        partecipants: { $ref: "#/components/schemas/UserCollection" }
      required:
        - id
        - name
        - partecipants

    Error:
      title: Error
      description: This object represents a single error
      type: object
      properties:
        code:
          description: Error code
          type: string
          pattern: "^[0-9]{1,3}$"
          minLength: 1
          maxLength: 3
          example: "404"
        message:
          description: Error message
          type: string
          minLength: 0
          maxLength: 50
          example: "Resource not found"
      required:
        - code
        - message

  #-- PARAMETERS
  parameters:
    username:
      name: username
      description: User username
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Username" }

    userID:
      name: userID
      description: Unique user identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

    conversationID:
      name: conversationID
      description: Unique conversation identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

    recipientID:
      name: recipientID
      description: Unique recipient identifier
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

    messageID:
      name: messageID
      description: Unique message identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

    reactionID:
      name: reactionID
      description: Unique reaction identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

    groupID:
      description: Unique group identifier
      name: groupID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

  #-- RESPONSES
  responses:
    NoContent:
      description: The server successfully processed the request, and is not returning any content

    BadRequest:
      description: The server cannot or will not process the request due to something that is perceived to be a client error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: The client does not have access rights to the content
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: The server can not find the requested resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: The server encountered an unexpected condition that prevented it from fulfilling the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  #-- SECURITY SCHEMES
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer