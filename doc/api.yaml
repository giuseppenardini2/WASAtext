openapi: 3.0.0
servers:
  - url: "http://localhost:3000"
info:
  title: WASAtext
  description: |-
    Connect with your friends effortlessly using WASAText! Send and receive messages, whether one-on-one
    or in groups, all from the convenience of your PC. Enjoy seamless conversations with text or GIFs and
    easily stay in touch through your private chats or group discussions.
  version: 0.0.1

tags:
  - name: "login"
    description: Login operations
  - name: "users"
    description: User management operations
  - name: "messages"
    description: Message operations
  - name: "conversations"
    description: Conversation operations
  - name: "groups"
    description: Group operations

#------------
# PATHS
#------------
paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              description: Username
              type: object
              properties:
                name:
                  description: Username
                  type: string
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                description: User identifier
                type: object
                properties:
                  identifier:
                    description: Identifier
                    type: integer
                    example: 123
                    minimum: 0

  /users:
    get:
      operationId: getUsers
      tags: ["users"]
      summary: Get the list of the users
      description: |-
        Return a list of users
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/username"
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Users" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{userID}:
    parameters:
      - $ref: "#/components/parameters/userID"

    get:
      operationId: getMyConversations
      tags: ["users"]
      summary: Get the list of the user conversation
      description: |- 
        Return a list of user conversation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversations" }
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: setMyUserName
      tags: ["users"]
      summary: Set username
      description: |-
        Set the user username
      security:
        - bearerAuth: []
      requestBody:
        description: New username
        content:
          application/json:
            schema:
              description: Username
              type: object
              properties:
                username: { $ref: "#/components/schemas/Username" }
        required: true
      responses:
        "200":
          description: Username updated successful
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Username" }
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userID}/photos:
    put:
      operationId: setMyPhoto
      tags: ["users"]
      summary: Set the user picture
      description: |-
        Set the user profile picture
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
      requestBody:
        content:
          application/json:
            schema:
              description: User picture
              type: object
              properties:
                picture: { $ref: "#/components/schemas/Picture" }
        required: true
      responses:
        "200":
          description: Photo successfully uploaded
          content:
            text/plain:
              schema:
                description: Confirmation message
                type: string
                example: "Photo successfully uploaded"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userID}/conversations:
    get:
      operationId: getConversation
      tags: ["conversations"]
      summary: Get a single user conversation
      description: |-
        Get a single conversation of the user using the recipient id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/recipientID"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userID}/conversations/{conversationID}/messages:
    post:
      operationId: sendMessage
      tags: ["messages"]
      summary: Send a message to a user
      description: |-
        Send a message to a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/conversationID"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Message" }
        required: true
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /users/{userID}/conversations/{conversationID}/messages/{messageID}:
    parameters:
      - $ref: "#/components/parameters/userID"
      - $ref: "#/components/parameters/messageID"
      - $ref: "#/components/parameters/conversationID"

    post:
      operationId: forwardMessage
      tags: ["messages"]
      summary: Forward a message to a user
      description: |-
        Forward a message to a user
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/recipientID"
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identifier" }

    delete:
      operationId: deleteMessage
      tags: ["messages"]
      summary: Delete a message
      description: |-
        Delete a message
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Message deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userID}/conversations/{conversationID}/messages/{messageID}/reactions:
    post: 
      operationId: commentMessage
      tags: ["messages"]
      summary: Comment a message
      description: |-
        Comment a message
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/conversationID"
        - $ref: "#/components/parameters/messageID"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Reaction" }
        required: true
      responses:
        "201":
          description: Reaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reaction" }

  /users/{userID}/conversations/{conversationID}/messages/{messageID}/reactions/{reactionID}:
    delete:
      operationId: uncommentMessage
      tags: ["messages"]
      summary: Uncomment a message
      description: |-
        Uncomment a message
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/conversationID"
        - $ref: "#/components/parameters/messageID"
        - $ref: "#/components/parameters/reactionID"
      responses:
        "204": 
          description: Message uncomment successfully
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userID}/groups:
    post:
      operationId: createGroup
      tags: ["groups"]
      summary: Create a group
      description: |-
        Create a group
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Group" }
        required: true
      responses:
        "201":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }

  /users/{userID}/groups/{groupID}:
    parameters:
      - $ref: "#/components/parameters/userID"
      - $ref: "#/components/parameters/groupID"

    put:
      operationId: setGroupName
      tags: ["groups"]
      summary: Set the name of a group
      description: |-
        Set the group name
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              description: Group name
              type: object
              properties:
                name: { $ref: "#/components/schemas/GroupName" }
        required: true
      responses:
        "200":
          description: Group name updated successful
          content: 
            application/json:
              schema: { $ref: "#/components/schemas/GroupName" }
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      operationId: leaveGroup
      tags: ["groups"]
      summary: Leave a group
      description: |-
        Leave the user from the current group
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Group left successfully
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userID}/groups/{groupID}/participants:
    put:
      operationId: addToGroup
      tags: ["groups"]
      summary: Add the a user to the current group
      description: |-
        Add the current user to a group
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/groupID"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/User" }
        required: true
      responses:
        "200":
          description: ID of the user added to the group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identifier"}
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{userID}/groups/{groupID}/photos:
    put:
      operationId: setGroupPhoto
      tags: ["groups"]
      summary: Set the photo of a group
      description: |-
        Set the group profile picture
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/groupID"
      requestBody:
        content:
          application/json:
            schema:
              description: User picture
              type: object
              properties:
                picture: { $ref: "#/components/schemas/Picture" }
        required: true
      responses:
        "200":
          description: Photo successfully uploaded
          content:
            text/plain:
              schema:
                description: Confirmation message
                type: string
                example: "Photo successfully uploaded"
        "404":
          $ref: "#/components/responses/NotFound"


#------------
# COMPONENTS
#------------
components:
  #-- SCHEMAS
  schemas:
    Identifier:
      title: Identifier
      description: This object represents a single identifier
      type: integer
      minimum: 0
      example: 123

    Username:
      title: Username
      description: This object represents a single username
      type: string
      pattern: '^.*?$'
      minLength: 3
      maxLength: 16
      example: "SignorG"

    Picture:
      title: Picture
      description: User or group picture
      type: string
      format: binary
      minLength: 0
      maxLength: 9999

    User:
      title: User
      description: This object represents a single user
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        username: { $ref: "#/components/schemas/Username" }
        profilePicture: { $ref: "#/components/schemas/Picture" }
      required:
        - id
        - username
        - profilePicture
    
    Users:
      title: Users
      description: This object represents a list of user object
      type: object
      properties:
        usersList:
          description: Users
          type: array
          items: { $ref: "#/components/schemas/User" }
          uniqueItems: true
          minItems: 0
          maxItems: 50
      required:
        - usersList

    Conversation:
      title: Conversation
      description: This object represents a single conversation
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        picture: { $ref: "#/components/schemas/Picture" }
        messagePreview:
          description: Last message preview
          type: string
          pattern: "[^\n\t]"
          minLength: 1
          maxLength: 20
          example: "Ciao Enzo, ..."
        date:
          description: The date of the last sent message
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          example: "2017-07-21T17:32:28Z"
          minLength: 20
          maxLength: 20
      required:
        - id
        - picture
        - messagePreview
        - date

    Conversations:
      title: Conversations
      description: This object represents a list of conversation object
      type: object
      properties:
        conversationsList:
          description: Conversations of the current user
          type: array
          items: { $ref: "#/components/schemas/Conversation" }
          uniqueItems: true
          minItems: 0
          maxItems: 50
      required:
        - conversationsList
          
    Message:
      title: Message
      description: This object represents a single message
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        body:
          description: Message body
          type: string
          pattern: "[^\\\\]"
          minLength: 1
          maxLength: 200
          example: "Hello Enzo"
        picture: { $ref: "#/components/schemas/Picture" }
        date:
          description: Message send date
          type: string
          format: date-time
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          example: "2017-07-21T17:32:28Z"
          minLength: 20
          maxLength: 20
      required:
        - id
        - body
        - date

    Reaction:
      title: Message reaction
      description: This object represents a single reaction to a message
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        body:
          description: A emojii
          type: string
          pattern: "^.*?$"
          minLength: 1
          maxLength: 1
          example: "😂"
      required:
        - id
        - body

    GroupName:
      title: Group name
      description: Group name
      type: string
      pattern: ^[a-zA-Z0-9\s!?-]{3,20}$
      example: "I due corsari"
      minLength: 3
      maxLength: 20

    Group:
      title: Group
      description: This object represents a single group
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        name: { $ref: "#/components/schemas/GroupName" }
        partecipants: { $ref: "#/components/schemas/Users" }
      required:
        - id
        - name

    Error:
      title: Error
      description: This object represents a single Error
      type: object
      properties:
        code:
          description: Error code
          type: string
          pattern: "^[0-9]{1,3}$"
          minLength: 1
          maxLength: 3
          example: "404"
        message:
          description: Error message
          type: string
          minLength: 0
          maxLength: 50
          example: "Resource not found"
      required:
        - code
        - message

  #-- PARAMETERS
  parameters:
    username:
      name: username
      description: User username
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Username" }

    userID:
      name: userID
      description: Unique user identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

    conversationID:
      name: conversationID
      description: Unique conversation identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

    recipientID:
      name: recipientID
      description: Unique recipient identifier
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

    messageID:
      name: messageID
      description: Unique message identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

    reactionID:
      name: reactionID
      description: Unique reaction identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

    groupID:
      description: Unique group identifier
      name: groupID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

  #-- RESPONSES
  responses:
    BadRequest:
      description: The server could not understand the request due to incorrect syntax
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFound:
      description: The server can not find the requested resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: The server encountered an unexpected condition that prevented it from fulfilling the request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  #-- SECURITY SCHEMES
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer