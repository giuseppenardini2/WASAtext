openapi: 3.0.0
servers:
  - url: "http://localhost:3000"
info:
  title: WASAtext
  description: |-
    Connect with your friends effortlessly using WASAText! Send and receive messages, whether one-on-one
    or in groups, all from the convenience of your PC. Enjoy seamless conversations with text or GIFs and
    easily stay in touch through your private chats or group discussions.
  version: 0.0.1

tags:
  - name: "login"
    description: Login operations
  - name: "users"
    description: User management operations
  - name: "messages"
    description: Message operations
  - name: "conversations"
    description: Conversation operations
  - name: "groups"
    description: Group operations

#------------
# PATHS
#------------
paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  pattern: '^.*?$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"

  /users/{userID}:
    parameters:
      - $ref: "#/components/parameters/userID"

    get:
      operationId: getMyConversations
      tags: ["users"]
      summary: Get the list of the user conversation
      description: |- 
        Return a list of user conversation
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversations" }
        "404":
          $ref: "#/components/responses/404NotFound"

    put:
      operationId: setMyUserName
      tags: ["users"]
      summary: Set username
      description: |-
        Set the user username
      requestBody:
        description: New username
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Identifier" }
      responses:
        "200":
          description: Username updated successful
          content: 
            application/json:
              schema: { $ref: "#/components/schemas/Identifier" }
        "404":
          $ref: "#/components/responses/404NotFound"

  /users/{userID}/photos/:
    put: #TODO: Sicuro che sia un put e non un post? Potresti fare tipo '{usersID}/photos' Però la foto è un attributo dello user quindi è più forse put
      operationId: setMyPhoto
      tags: ["users"]
      summary: Set the user picture
      description: |-
        Set the user profile picture
      parameters:
        - $ref: "#/components/parameters/userID"
      requestBody:
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Photo updated successfully #Potrebbe ritornare un immagine o l'id dell'immagine (quindi trattarla come un oggetto)
        "404":
          $ref: "#/components/responses/404NotFound"

  /users/{userID}/conversations/:
    get:
      operationId: getConversation
      tags: ["conversations"]
      summary: Get a single user conversation
      description: |-
        Get a single conversation of the user using the recipient id
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/recipientID"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "404":
          $ref: "#/components/responses/404NotFound"

  /users/{userID}/conversations/{conversationID}/messages/:
    post:
      operationId: sendMessage
      tags: ["messages"]
      summary: Send a message to a user
      description: |-
        Send a message to a user
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/conversationID"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Message" }
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }

  /users/{userID}/conversations/{conversationID}/messages/{messageID}:
    parameters:
      - $ref: "#/components/parameters/userID"
      - $ref: "#/components/parameters/messageID"
      - $ref: "#/components/parameters/conversationID"
      - $ref: "#/components/parameters/recipientID"

    post:
      operationId: forwardMessage
      tags: ["messages"]
      summary: Forward a message to a user
      parameters:
        - $ref: "#/components/parameters/recipientID"
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identifier" }

    delete:
      operationId: deleteMessage
      tags: ["messages"]
      summary: Delete a message
      description: |-
        Delete a message
      responses:
        "204":
          description: Message deleted successfully
        "404":
          $ref: "#/components/responses/404NotFound"

  /users/{userID}/conversations/{conversationID}/messages/{messageID}/reactions/:
    post: 
      operationId: commentMessage
      tags: ["messages"]
      summary: Comment a message
      description: |-
        Comment a message
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/conversationID"
        - $ref: "#/components/parameters/messageID"
      responses:
        "200":
          description: Reaction
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Reaction"}

  /users/{userID}/conversations/{conversationID}/messages/{messageID}/reactions/{reactionID}:
    delete:
      operationId: uncommentMessage
      tags: ["messages"]
      summary: Uncomment a message
      description: |-
        Uncomment a message
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/conversationID"
        - $ref: "#/components/parameters/messageID"
        - $ref: "#/components/parameters/reactionID"
      responses:
        "204": 
          description: Message uncomment successfully
        "404":
          $ref: "#/components/responses/404NotFound"

  /users/{userID}/groups/{groupID}:
    parameters:
      - $ref: "#/components/parameters/userID"
      - $ref: "#/components/parameters/groupID"

    put:
      operationId: setGroupName
      tags: ["groups"]
      summary: Set the name of a group
      description: |-
        Set the group name 
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                groupName:
                  type: string
                  example: "New group name"
      responses:
        "200":
          description: Group name updated successful
          content: 
            application/json:
              schema:
                type: object
                properties:
                  groupName:
                    type: string
                    example: "New group name"
        "404":
          $ref: "#/components/responses/404NotFound"

    delete:
      operationId: leaveGroup
      tags: ["groups"]
      summary: Leave a group
      description: |-
        Leave the user from the current group
      responses:
        "204":
          description: Group left successfully
        "404":
          $ref: "#/components/responses/404NotFound"

  /users/{userID}/groups/{groupID}/partecipants/:
    put:
      operationId: addToGroup
      tags: ["groups"]
      summary: Add the a user to the current group
      description: |-
        Add the current user to a group
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/groupID"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/User" }
      responses:
        "200":
          description: ID of the user added to the group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Identifier"}
        "404":
          $ref: "#/components/responses/404NotFound"

  /users/{userID}/groups/{groupID}/photos/:
    put:
      operationId: setGroupPhoto
      tags: ["groups"]
      summary: Set the photo of a group
      description: |-
        Set the group profile picture
      parameters:
        - $ref: "#/components/parameters/userID"
        - $ref: "#/components/parameters/groupID"
      requestBody:
        content:
          image/*:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Photo updated successfully #Potrebbe ritornare un immagine o l'id dell'immagine (quindi trattarla come un oggetto)
        "404":
          $ref: "#/components/responses/404NotFound"


#------------
# COMPONENTS
#------------
components:
  #-- SCHEMAS
  schemas:
    Identifier:
      title: Identifier
      description: This object represents a single identifier
      type: object
      properties:
        id:
          description: Integer id
          type: integer
          example: 123
          minimum: 0

    User:
      title: User
      description: This object represents a single user
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        nickname:
          description: User nickaname
          type: string
          minLength: 5
          maxLength: 15
          example: "SignorG"
        profile_picture:
          description: User's profile picture
          type: string
          format: binary
          minLength: 0
          maxLength: 9999
        password: #TODO: È da eliminare visto che c'è il simplified login??
          description: User's password
          type: string
          format: password
          example: "passwordsicura1234"

    Conversation:
      title: Conversation
      description: This object represents a single conversation
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        picture:
          description: User or group profile picture
          type: string
          format: binary
          minLength: 0
          maxLength: 9999
        message_preview:
          description: Last message preview
          type: string
          minLength: 1
          maxLength: 20
          example: "Ciao Enzo, ..."
        date:
          description: The date of the last sent message
          type: string
          format: date-time
          example: 2017-07-21T17:32:28Z

    Conversations:
      title: Conversations
      description: This object represents a list of conversation object
      type: object
      properties:
        conversations:
          type: array
          description: Conversations of the current user
          items: { $ref: "#/components/schemas/Conversations" }
          uniqueItems: true
          minItems: 0
          maxItems: 50
          
    Message:
      title: Message
      description: This object represents a single message
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        body:
          description: Message body
          type: string
          example: "Hello Enzo"
        picture:
          description: Picture attacched to the message
          type: string
          format: binary
          minLength: 0
          maxLength: 9999
        date:
          description: Message send date
          type: string
          format: date-time
          example: 2017-07-21T17:32:28Z

    Reaction:
      title: Message Reaction
      description: This object represents a single reaction to a message
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        body:
          description: A emojii
          type: string
          minLength: 1
          maxLength: 1
          example: "😂"
        
    Group:
      title: Group
      description: This object represents a single group
      type: object
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        name:
          description: Group name
          type: string
          minLength: 3
          maxLength: 20
          example: "Gaber fans club"

    Error:
      title: Error
      description: This object represents a single Error
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 3
          example: "404"
        message:
          type: string
          minLength: 0
          maxLength: 50
          example: "Resource not found"
      required:
        - code
        - message

  #-- PARAMETERS
  parameters:
    userID:
      name: userID
      description: Unique user identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    conversationID:
      name: conversationID
      description: Unique conversation identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    recipientID:
      name: recipientID
      description: Unique recipient identifier
      in: query
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    messageID:
      name: messageID
      description: Unique message identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    reactionID:
      name: reactionID
      description: Unique reaction identifier
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    groupID:
      description: Unique group identifier
      name: groupID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }

  #-- RESPONSES
  responses:
    404NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
